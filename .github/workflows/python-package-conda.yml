# Optional independent Conda dependency-resolution check; not a duplicate
# pull-request gate. Run manually to examine a separate numerical stack.
name: StringLab · optional Conda compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: stringlab-ci
          environment-file: environment.yml
          auto-activate-base: false
      - name: Run scientific unit tests with Conda
        shell: bash -el {0}
        run: python -m pytest -q
